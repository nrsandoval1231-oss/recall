name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/backend/Dockerfile -t recall-backend:ci .
      - name: Import packaged backend as the restricted runtime user
        run: docker run --rm recall-backend:ci python -c "import recall.api.app; import recall.ingestion.worker; import recall.db.backup"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-16-pgvector
      - run: npm ci
      - working-directory: services/backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -q
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @recall/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Desktop production build
        working-directory: apps/desktop
        env: { VITE_API_BASE_URL: http://localhost:8000, VITE_SUPABASE_URL: https://example.invalid, VITE_SUPABASE_PUBLISHABLE_KEY: placeholder }
        run: npx vite build
      - name: iOS JS bundle (no signing, no device)
        working-directory: apps/mobile
        env: { EXPO_PUBLIC_API_BASE_URL: http://localhost:8000, EXPO_PUBLIC_SUPABASE_URL: https://example.invalid, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder }
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
  desktop-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - run: npm ci
      - working-directory: apps/desktop/src-tauri
        run: cargo test --lib -- --nocapture && cargo check
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - working-directory: apps/desktop/src-tauri
        run: cargo test --lib -- --nocapture
      - working-directory: apps/desktop/src-tauri
        run: cargo check
      - name: Build unsigned private pilot Windows installer
        if: ${{ vars.RECALL_PILOT_API_URL != '' && vars.RECALL_PILOT_SUPABASE_URL != '' && vars.RECALL_PILOT_SUPABASE_PUBLISHABLE_KEY != '' }}
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.RECALL_PILOT_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.RECALL_PILOT_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.RECALL_PILOT_SUPABASE_PUBLISHABLE_KEY }}
        run: npx tauri build
      - name: Upload unsigned private pilot NSIS installer (7-day retention)
        if: ${{ vars.RECALL_PILOT_API_URL != '' && vars.RECALL_PILOT_SUPABASE_URL != '' && vars.RECALL_PILOT_SUPABASE_PUBLISHABLE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: recall-windows-private-pilot
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
