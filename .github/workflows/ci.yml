name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/backend/Dockerfile -t recall-backend:ci .
      - name: Import packaged backend as the restricted runtime user
        run: docker run --rm recall-backend:ci python -c "import recall.api.app; import recall.ingestion.worker; import recall.db.backup"
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Configure reliable Ubuntu package downloads
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99recall-ci-network >/dev/null
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-16-pgvector
      - run: npm ci
      - working-directory: services/backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -q
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @recall/web
      - name: Configure reliable Ubuntu package downloads
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99recall-ci-network >/dev/null
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Desktop production build
        working-directory: apps/desktop
        env: { VITE_API_BASE_URL: http://localhost:8000, VITE_SUPABASE_URL: https://example.invalid, VITE_SUPABASE_PUBLISHABLE_KEY: placeholder }
        run: npx vite build
      - name: iOS JS bundle (no signing, no device)
        working-directory: apps/mobile
        env: { EXPO_PUBLIC_API_BASE_URL: http://localhost:8000, EXPO_PUBLIC_SUPABASE_URL: https://example.invalid, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder }
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
  desktop-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Configure reliable Ubuntu package downloads
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g; s|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99recall-ci-network >/dev/null
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - run: npm ci
      - working-directory: apps/desktop/src-tauri
        run: cargo test --lib -- --nocapture && cargo check
      - name: Build native phone companion
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --bin recall-phone
      - run: npx playwright install --with-deps chromium
      - name: Real native companion and browser offline recovery (synthetic data)
        id: phone_recovery
        env: { TYPESAFE_API_KEY: "", RECALL_CLAUDE_API_KEY: "" }
        run: npm run test:phone
      - name: Retain synthetic phone workflow failure evidence
        if: ${{ failure() && steps.phone_recovery.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-recovery-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - working-directory: apps/desktop/src-tauri
        run: cargo test --lib -- --nocapture
      - working-directory: apps/desktop/src-tauri
        run: cargo check
      - name: Build unsigned Windows installer for the desktop vault
        working-directory: apps/desktop
        run: npx tauri build
      - name: Upload unsigned Windows installer (7-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: recall-windows-desktop
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
  adaptive-desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @recall/desktop
      - run: npx playwright install --with-deps chromium
      - name: Canonical adaptive UI, accessibility and synthetic IPC walkthroughs
        run: |
          npm exec -w @recall/desktop -- vite preview --host 127.0.0.1 --port 4173 &
          node --input-type=module -e 'const url="http://127.0.0.1:4173"; for(let i=0;i<50;i++){try{await fetch(url);process.exit(0)}catch{await new Promise(r=>setTimeout(r,200))}}process.exit(1)'
          npm run test:visual -w @recall/desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-adaptive-ui-synthetic-evidence
          path: docs/audits/adaptive/
          retention-days: 7
