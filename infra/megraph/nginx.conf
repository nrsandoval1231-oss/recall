server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;
    client_max_body_size 36m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /v1/operator/ { return 404; }
    # One-time enrollment and revocation also serve the native desktop transport.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 650s;
        proxy_request_buffering off;
    }
    location = /healthz { return 200 'ok'; }
    location = /sw.js { add_header Cache-Control no-cache; }
    location / { try_files $uri $uri/ /index.html; }
}
