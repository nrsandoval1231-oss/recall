[project]
name = "recall-backend"
version = "0.1.0"
description = "Recall memory API (RCL-001: trusted capture)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "pydantic-settings",
  "PyJWT[crypto]",
  "httpx",
  "pillow",
  "jsonschema[format]",
  "anthropic>=1.11.0",
  "pillow-heif>=1.8.0",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "mypy",
  "types-jsonschema",
  "cryptography",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: starts a real server process and the TypeScript clients",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psycopg_pool.*"]
ignore_missing_imports = true
