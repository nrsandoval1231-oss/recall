[package]
name = "recall-desktop"
version = "0.1.0"
description = "Recall desktop (RCL-001: trusted capture viewer)"
edition = "2021"
publish = false

[lib]
name = "recall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Windows Credential Manager on Windows; kernel keyutils on Linux (dev/CI check only).
keyring = { version = "3", default-features = false, features = ["windows-native", "linux-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15.4"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls", "native-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
